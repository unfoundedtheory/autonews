[project]
name = "unfounded-theory-automation"
version = "0.7.0"
description = "Editorial-first Unfounded Theory Instagram automation"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.110,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3",
 "pydantic>=2,<3", "httpx>=0.27,<1", "pillow>=11,<13",
 "beautifulsoup4>=4.12,<5", "openai>=1.50,<3",
 "psycopg[binary]>=3.1,<4", "python-dotenv>=1,<2", "defusedxml>=0.7,<1", "feedparser>=6.0.11,<7"
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["utbot*"]
exclude = ["tests*", "scripts*", "outputs*", "media*", "deploy*", "assets*", "docs*"]

[tool.setuptools.package-data]
utbot = ["assets/*.png"]
